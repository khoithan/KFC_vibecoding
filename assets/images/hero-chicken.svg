<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="100%" height="100%">
  <defs>
    <radialGradient id="heroSunburst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFC72C" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#FFC72C" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFF8F0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drumstickGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="35%" stop-color="#D97706"/>
      <stop offset="85%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="boneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F3F4F6"/>
      <stop offset="100%" stop-color="#D1D5DB"/>
    </linearGradient>
    <filter id="heroGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#8F0D22" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background glow circle -->
  <circle cx="160" cy="140" r="130" fill="url(#heroSunburst)"/>

  <!-- Dynamic burst lines -->
  <path d="M 160 30 L 160 10 M 70 60 L 50 45 M 250 60 L 270 45 M 35 140 L 15 140 M 285 140 L 305 140 M 65 215 L 45 230 M 255 215 L 275 230" stroke="#FFC72C" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- Little sparkle stars -->
  <path d="M 50 90 Q 60 90 60 80 Q 60 90 70 90 Q 60 90 60 100 Q 60 90 50 90 Z" fill="#FFC72C"/>
  <path d="M 260 95 Q 268 95 268 87 Q 268 95 276 95 Q 268 95 268 103 Q 268 95 260 95 Z" fill="#C8102E"/>
  <path d="M 230 200 Q 236 200 236 194 Q 236 200 242 200 Q 236 200 236 206 Q 236 200 230 200 Z" fill="#FFC72C"/>

  <!-- Floating crispy crumbs -->
  <circle cx="90" cy="85" r="4" fill="#D97706"/>
  <circle cx="240" cy="75" r="3.5" fill="#B45309"/>
  <circle cx="75" cy="175" r="4.5" fill="#F59E0B"/>
  <circle cx="245" cy="165" r="3" fill="#D97706"/>
  <polygon points="105,195 110,198 106,202" fill="#92400E"/>
  <polygon points="215,60 219,63 216,66" fill="#D97706"/>

  <!-- Main Hero Crispy Drumstick (Tilted dynamically) -->
  <g transform="rotate(-18 160 145)" filter="url(#heroGlow)">
    <!-- Shadow -->
    <ellipse cx="160" cy="210" rx="60" ry="12" fill="#000000" opacity="0.2"/>

    <!-- Bone -->
    <path d="M 85,142 C 75,140 70,147 62,143 C 55,139 52,145 54,152 C 55,157 60,161 68,158 C 72,166 82,165 88,156 Z" fill="url(#boneGrad)"/>
    <circle cx="56" cy="148" r="6" fill="#F3F4F6"/>
    <circle cx="62" cy="158" r="5.5" fill="#E5E7EB"/>
    <rect x="75" y="146" width="30" height="12" rx="3" fill="#F9FAFB"/>

    <!-- Meat Bulb -->
    <!-- Crispy irregular textured contour -->
    <path d="M 98,148 
             C 105,130 115,108 140,95 
             C 170,80 215,85 240,110 
             C 265,135 260,175 230,195 
             C 200,215 155,205 130,190 
             C 112,178 102,165 98,148 Z" 
          fill="url(#drumstickGrad)"/>

    <!-- Crispy crunch flakes and texture highlights -->
    <!-- Flake 1 -->
    <path d="M 135,115 C 150,105 175,108 185,118 C 175,124 150,122 135,115 Z" fill="#FDE68A" opacity="0.6"/>
    <!-- Flake 2 -->
    <path d="M 160,135 C 180,125 210,130 220,145 C 205,152 180,148 160,135 Z" fill="#FEF3C7" opacity="0.7"/>
    <!-- Flake 3 -->
    <path d="M 130,155 C 145,145 170,150 178,162 C 165,168 142,165 130,155 Z" fill="#FCD34D" opacity="0.5"/>
    <!-- Deep crunch spots -->
    <ellipse cx="205" cy="120" rx="8" ry="4" fill="#78350F" opacity="0.5"/>
    <ellipse cx="185" cy="165" rx="10" ry="5" fill="#78350F" opacity="0.5"/>
    <ellipse cx="145" cy="175" rx="7" ry="3.5" fill="#78350F" opacity="0.4"/>
    <circle cx="225" cy="140" r="3" fill="#FEF3C7"/>
    <circle cx="165" cy="110" r="2.5" fill="#FEF3C7"/>
    <circle cx="195" cy="180" r="2.5" fill="#FBBF24"/>
  </g>

  <!-- Badge banner: 100% Giòn Rụm -->
  <g transform="translate(195, 185)">
    <rect x="0" y="0" width="105" height="34" rx="17" fill="#C8102E" stroke="#FFFFFF" stroke-width="2"/>
    <text x="52" y="22" font-family="Arial, sans-serif" font-weight="900" font-size="12" fill="#FFC72C" text-anchor="middle">100% GIÒN RỤM</text>
  </g>
</svg>
